<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Prywatne AI Video - Multi-Token</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body class="bg-slate-950 text-white min-h-screen font-sans flex flex-col justify-between p-4 max-w-md mx-auto">

  <div>
    <header class="py-4 border-b border-slate-800 mb-6 flex justify-between items-center">
      <h1 class="font-bold text-lg text-indigo-400">Studio Generatora</h1>
      <span class="text-xs bg-emerald-900 text-emerald-200 px-2.5 py-1 rounded-full">Auto-Rotacja Tokenów</span>
    </header>

    <form id="gen-form" class="space-y-4">
      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="block text-xs font-semibold text-slate-400">TOKENY HUGGING FACE (każdy w nowej linii)</label>
          <span id="token-counter" class="text-[10px] text-slate-500">Aktywne: 0</span>
        </div>
        <textarea id="hf-tokens" rows="3" placeholder="hf_token_pierwszy...&#10;hf_token_drugi..." 
                  class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs font-mono focus:outline-none focus:border-indigo-500 resize-none"></textarea>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">WYBIERZ MODEL</label>
        <select id="engine" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500">
          <option value="Lightricks/ltx-video-distilled">LTX Video Distilled</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">OPIS SCENY (PROMPT)</label>
        <textarea id="prompt" rows="3" placeholder="A glowing neon jellyfish floating..." 
                  class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500 resize-none">A glowing neon jellyfish floating smoothly through dark blue deep ocean, cinematic lighting, highly detailed</textarea>
      </div>

      <button type="submit" id="gen-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-3.5 rounded-xl transition">
        Wygeneruj Klip
      </button>
    </form>

    <!-- Status -->
    <div id="status" class="mt-6 hidden text-center text-sm text-slate-300 bg-slate-900 p-3 rounded-xl border border-slate-800 space-y-2">
      <div id="status-text" class="animate-pulse text-indigo-400 font-medium">Inicjalizacja...</div>
      <div id="debug-text" class="text-xs font-mono text-red-400 hidden text-left whitespace-pre-wrap break-all"></div>
    </div>

    <!-- Wynik -->
    <div id="result-container" class="mt-6 hidden space-y-3">
      <h3 class="text-xs font-semibold text-slate-400">GOTOWE WIDEO</h3>
      <video id="output-video" controls class="w-full rounded-xl border border-slate-800 bg-black" playsinline></video>
      <a id="download-btn" download="video.mp4" target="_blank" class="block text-center bg-emerald-600 hover:bg-emerald-500 font-bold py-2.5 rounded-xl text-sm transition">
        Zapisz wideo
      </a>
    </div>
  </div>

  <script>
    const tokensInput = document.getElementById('hf-tokens');
    const tokenCounter = document.getElementById('token-counter');

    function updateTokenCount() {
      const tokens = getTokens();
      tokenCounter.innerText = `Aktywne: ${tokens.length}`;
    }

    function getTokens() {
      return tokensInput.value
        .split('\n')
        .map(t => t.trim())
        .filter(t => t.startsWith('hf_'));
    }

    document.addEventListener('DOMContentLoaded', () => {
      const savedTokens = localStorage.getItem('hf_tokens_pool');
      if (savedTokens) {
        tokensInput.value = savedTokens;
        updateTokenCount();
      }
    });

    tokensInput.addEventListener('input', () => {
      localStorage.setItem('hf_tokens_pool', tokensInput.value);
      updateTokenCount();
    });

    document.getElementById('gen-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const tokens = getTokens();
      const prompt = document.getElementById('prompt').value.trim();
      
      const genBtn = document.getElementById('gen-btn');
      const statusBox = document.getElementById('status');
      const statusText = document.getElementById('status-text');
      const debugText = document.getElementById('debug-text');
      const resultBox = document.getElementById('result-container');

      if (tokens.length === 0) return alert("Wklej przynajmniej jeden poprawny token Hugging Face (zaczynający się od hf_...)!");
      if (!prompt) return alert("Wpisz opis sceny!");

      genBtn.disabled = true;
      statusBox.classList.remove('hidden');
      debugText.classList.add('hidden');
      resultBox.classList.add('hidden');

      let success = false;
      let lastError = "";

      // Pętla rotacji tokenów
      for (let i = 0; i < tokens.length; i++) {
        const currentToken = tokens[i];
        statusText.innerText = `Próba z tokenem #${i + 1} (rezerwacja GPU)...`;

        try {
          const initRes = await fetch("https://lightricks-ltx-video-distilled.hf.space/gradio_api/call/predict", {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${currentToken}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              data: [prompt, "worst quality, low quality", 42, true, 704, 480, 3.0, 25]
            })
          });

          if (!initRes.ok) {
            const errBody = await initRes.text();
            throw new Error(`Token #${i + 1} odrzucony (Status ${initRes.status})`);
          }

          const { event_id } = await initRes.json();
          if (!event_id) throw new Error(`Token #${i + 1} nie zwrócił zadania.`);

          statusText.innerText = `Token #${i + 1} aktywny! Generowanie wideo...`;

          // Oczekiwanie na strumień SSE
          await new Promise((resolve, reject) => {
            const eventSource = new EventSource(`https://lightricks-ltx-video-distilled.hf.space/gradio_api/call/predict/${event_id}`);
            
            const timeout = setTimeout(() => {
              eventSource.close();
              reject(new Error("Przekroczono czas oczekiwania na strumień (timeout)"));
            }, 60000);

            eventSource.onmessage = (event) => {
              try {
                const parsed = JSON.parse(event.data);
                if (Array.isArray(parsed) && parsed[0]) {
                  let videoData = parsed[0];
                  let videoUrl = videoData.url || videoData.path || videoData;

                  if (typeof videoUrl === 'string') {
                    if (!videoUrl.startsWith('http')) {
                      videoUrl = `https://lightricks-ltx-video-distilled.hf.space/gradio_api/file=${videoUrl}`;
                    }

                    clearTimeout(timeout);
                    eventSource.close();

                    document.getElementById('output-video').src = videoUrl;
                    document.getElementById('download-btn').href = videoUrl;
                    resultBox.classList.remove('hidden');
                    statusText.innerText = "Gotowe!";
                    success = true;
                    resolve();
                  }
                }
              } catch (e) {}
            };

            eventSource.onerror = (err) => {
              clearTimeout(timeout);
              eventSource.close();
              reject(new Error("Błąd strumienia danych SSE"));
            };
          });

          if (success) break; // Jeśli wygenerowano, przerywamy pętlę rotacji

        } catch (err) {
          lastError = err.message;
          console.warn(`Token #${i + 1} zawiódł. Próbuję kolejnego...`);
          // Pętla automatycznie przechodzi do kolejnego tokena z listy
        }
      }

      if (!success) {
        statusText.innerText = "Wszystkie tokeny zawiodły";
        debugText.classList.remove('hidden');
        debugText.innerText = `Ostatni błąd: ${lastError}\nWskazówka: Załóż dodatkowe darmowe konta na HF i dopisz ich tokeny w nowej linii.`;
      }

      genBtn.disabled = false;
    });
  </script>
</body>
</html>
